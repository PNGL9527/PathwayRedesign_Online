function createProject() {
  const section=createSection('First encounter');
  return {schema:SCHEMA,version:'0.1.0',id:uid('project'),title:'Untitled pathway',goal:'',period:'',volume:null,team:'',context:'',demo:false,
    dimensions:defaultDimensions(),settings:{combination:'sum',experienceWeight:1,managementWeight:1,weightRationale:''},sections:[section],
    nodes:[{id:uid('node'),sectionId:section.id,label:'Start here',kind:'process',x:300,y:70}],edges:[],updatedAt:new Date().toISOString()};
}
function groupScore(project,flow,side) {
  const dims=project.dimensions.filter(d=>d.side===side&&d.weight>0);
  if(!dims.length) return {value:null,complete:false,disabled:true,filled:0,total:0,weight:0};
  const filled=dims.filter(d=>Number.isFinite(flow.values[d.id]?.score)&&flow.values[d.id].score>=1&&flow.values[d.id].score<=10);
  const complete=filled.length===dims.length;
  const weight=dims.reduce((s,d)=>s+d.weight,0);
  return {value:complete?dims.reduce((s,d)=>s+flow.values[d.id].score*d.weight,0)/weight:null,complete,disabled:false,filled:filled.length,total:dims.length,weight};
}
function combinedScore(project,flow) {
  const e=groupScore(project,flow,'experience'),m=groupScore(project,flow,'management');
  if(project.settings.combination==='sum') return e.complete&&m.complete?e.value+m.value:null;
  const ew=project.settings.experienceWeight,mw=project.settings.managementWeight;
  if(ew+mw===0 || (ew>0&&!e.complete)||(mw>0&&!m.complete)) return null;
  return ((ew>0?ew*e.value:0)+(mw>0?mw*m.value:0))/(ew+mw);
}
function rows(project) {return project.sections.flatMap(s=>s.flows.map(f=>({section:s,flow:f,experience:groupScore(project,f,'experience'),management:groupScore(project,f,'management'),combined:combinedScore(project,f)})));}
function priorityRows(project) {return rows(project).filter(r=>r.combined!==null).sort((a,b)=>a.combined-b.combined);}
function csvCell(v) {let s=v==null?'':String(v);if(/^[\s]*[=+@-]/.test(s)&&!/^-[\d.]+$/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}
function csvExport(project) {
  const header=['Sub-section','Flow','Patient volume','Experience grade','Managerial grade',project.settings.combination==='sum'?'Sum / 20':'Weighted combined / 10','Insight','Experience summary','Managerial summary','Evidence source',...project.dimensions.flatMap(d=>[d.label+' | weight',d.label+' | observed value',d.label+' | grade / 10',d.label+' | evidence / reason'])];
  return '\ufeff'+[header,...rows(project).map(r=>[r.section.label,r.flow.label,r.flow.volume,r.experience.value,r.management.value,r.combined,r.flow.insight,r.flow.experienceNotes,r.flow.managementNotes,r.flow.source,...project.dimensions.flatMap(d=>[d.weight,r.flow.values[d.id]?.value,r.flow.values[d.id]?.score,r.flow.values[d.id]?.note])])].map(row=>row.map(csvCell).join(',')).join('\r\n');
}
// Import only this app's portable format. Validate before replacing the current project.
function validateProject(p) {
  const fail = message => {throw new Error(message);};
  if(!p||p.schema!==SCHEMA)fail('This is not a Pathway Redesign project (schema pathway-redesign/1).');
  const str=(v,max=20000)=>typeof v==='string'&&v.length<=max;
  const id=v=>str(v,100)&&/^[\w-]+$/.test(v)&&!['__proto__','constructor','prototype'].includes(v);
  const num=(v,max=1e9)=>typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=max;
  const optnum=(v,max=1e9)=>v===null||num(v,max);
  for(const key of ['title','goal','period','team','context'])if(!str(p[key]))fail('Invalid project field: '+key);
  if(!id(p.id)||!optnum(p.volume))fail('Invalid project identity or volume.');
  if(!Array.isArray(p.dimensions)||!p.dimensions.length||p.dimensions.length>40)fail('Use 1–40 dimensions.');
  const unique=(a,name)=>{if(new Set(a).size!==a.length)fail('Duplicate '+name+'.');};
  for(const d of p.dimensions)if(!id(d.id)||!['experience','management'].includes(d.side)||!str(d.label,160)||!str(d.labelZh??'',160)||!num(d.weight,100)||!str(d.unit,40)||!['text','number'].includes(d.kind)||!str(d.rubric))fail('Invalid dimension.');
  unique(p.dimensions.map(d=>d.id),'dimension IDs');
  if(!p.settings||!['sum','weighted'].includes(p.settings.combination)||!num(p.settings.experienceWeight,100)||!num(p.settings.managementWeight,100)||!str(p.settings.weightRationale))fail('Invalid scoring settings.');
  if(!Array.isArray(p.sections)||!p.sections.length||p.sections.length>100)fail('Use 1–100 sub-sections.');
  const flowIds=[];
  for(const s of p.sections){
    if(!id(s.id)||!str(s.label,300)||!str(s.summary)||!Array.isArray(s.flows)||!s.flows.length||s.flows.length>50)fail('Invalid sub-section.');
    for(const f of s.flows){
      flowIds.push(f.id);
      if(!id(f.id)||!str(f.label,300)||!optnum(f.volume)||!str(f.insight)||!str(f.experienceNotes)||!str(f.managementNotes)||!str(f.source)||!f.values||Array.isArray(f.values)||typeof f.values!=='object')fail('Invalid flow.');
      for(const [key,v]of Object.entries(f.values)){if(!id(key)||!v||!str(v.value??'',20000)||!str(v.note??'',20000)||!(v.score===null||(num(v.score,10)&&v.score>=1)))fail('Grades must be blank or between 1 and 10.');}
      if(!Array.isArray(f.discussion)||f.discussion.length>500)fail('Invalid discussion records.');
      for(const a of f.discussion)if(!id(a.id)||!str(a.text)||!str(a.owner,300)||!str(a.status,40)||!['open','agreed','testing','done'].includes(a.status))fail('Invalid discussion record.');
    }
  }
  unique(p.sections.map(s=>s.id),'section IDs');unique(flowIds,'flow IDs');
  if(!Array.isArray(p.nodes)||p.nodes.length>300||!Array.isArray(p.edges)||p.edges.length>600)fail('Graph limit: 300 nodes and 600 connections.');
  const sections=new Set(p.sections.map(s=>s.id));
  for(const n of p.nodes)if(!id(n.id)||!sections.has(n.sectionId)||!str(n.label,500)||!['process','decision','terminal'].includes(n.kind)||!num(n.x,10000)||!num(n.y,20000))fail('Invalid graph node.');
  for(const n of p.nodes)if(n.flowId&&!p.sections.find(s=>s.id===n.sectionId).flows.some(f=>f.id===n.flowId))fail('A node references a flow outside its sub-section.');
  unique(p.nodes.map(n=>n.id),'node IDs');
  const nodes=new Set(p.nodes.map(n=>n.id));
  for(const e of p.edges)if(!id(e.id)||!nodes.has(e.from)||!nodes.has(e.to)||!str(e.label,300))fail('A connection references a missing node.');
  unique(p.edges.map(e=>e.id),'connection IDs');
  return clone(p);
}

function openDialog(title,body,onSubmit,{submit,extra=''}={}){
 const dialog=$('#dialog');if(dialog.open)dialog.close();
 dialog.innerHTML=`<div class="dialog-header"><h2 id="dialog-title">${esc(title)}</h2><button type="button" data-modal-cancel class="quiet icon-only" aria-label="${t('Close','关闭')}">${icon('close')}</button></div><form id="dialog-form"><div class="dialog-body">${body}<div class="dialog-actions">${extra}<span class="spacer"></span><button type="button" data-modal-cancel>${t('Cancel','取消')}</button>${onSubmit?`<button type="submit" class="primary">${esc(submit||t('Save','保存'))}</button>`:''}</div></div></form>`;
 dialog.querySelectorAll('[data-modal-cancel]').forEach(b=>b.onclick=()=>dialog.close());
 dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(onSubmit){const result=onSubmit(data);if(result!==false)dialog.close();}};
 dialog.showModal();
}
function modalField(label,name,value='',{type='text',textarea=false,required=false,min=0,max=1e9,options=null}={}){return `<label class="field">${esc(label)}${options?`<select name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select>`:textarea?`<textarea name="${name}" ${required?'required':''} maxlength="20000">${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?`min="${min}" max="${max}" step="any"`:''} maxlength="${name==='label'||name==='labelZh'?160:500}">`}</label>`;}
function confirmDialog(title,message,fn){openDialog(title,`<p>${esc(message)}</p><p>${t('Download a JSON copy first if you want to keep the current version. Undo is also available during this session.','如需保留当前版本，请先下载 JSON。当前会话也支持撤销。')}</p>`,()=>fn(),{submit:t('Continue','继续'),extra:btn('export',t('Save JSON first','先保存 JSON'),'download','small')});}

function discussionDialog(id=null){const f=activeFlow(),a=f.discussion.find(a=>a.id===id);openDialog(t(a?'Edit discussion note':'Add to the conversation',a?'编辑讨论记录':'添加讨论记录'),modalField(t('Question, agreement or proposed change','问题、共识或拟议改进'),'text',a?.text||'',{textarea:true,required:true})+modalField(t('Perspective / owner','视角或负责人'),'owner',a?.owner||'')+modalField(t('Status','状态'),'status',a?.status||'open',{options:[['open',t('Open question','待讨论')],['agreed',t('Agreed','已达成共识')],['testing',t('Testing','测试中')],['done',t('Done','已完成')]]}),data=>mutate(()=>{if(a)Object.assign(a,data);else f.discussion.push({id:uid('note'),...data});}));}
function helpDialog(){openDialog(t('A shared conversation, step by step','逐步展开共同讨论'),`<div class="help-steps">${[[t('Agree on a purpose','明确共同目标'),t('Describe the healthcare service, the people involved and the improvement you want to explore.','明确服务范围、参与角色，以及希望探索的改进。')],[t('Build the measures together','共同确定评价方式'),t('Discuss dimensions, evidence, weights and what 1–10 means before assigning grades. Use 0 weight for context-only measures.','先讨论维度、证据、权重与 1–10 分的含义。参照性指标可设为 0 权重。')],[t('Map & bring in evidence','绘制路径，汇集证据'),t('Group steps into sub-sections, identify patient flows and place observations, quotes and operational data side by side.','划分子区段与患者分流，将观察、引语与运作数据放在一起。')],[t('Discuss & try a change','讨论并尝试改进'),t('Compare complete grades, return to the evidence and record questions, agreements and next steps.','比较完整评分，回到证据，记录问题、共识与下一步。')]].map(([h,p])=>`<div class="help-step"><h3>${h}</h3><p>${p}</p></div>`).join('')}</div><p style="margin-top:18px">${t('Editing the map: enable Edit map, drag nodes to move them, select a node to edit it, and use Connect to add a labelled branch. Flow selection controls the evidence in both side panels.','编辑路径：打开“编辑路径”，拖动节点，点击节点修改文字或所属区段，使用“连接”添加带标签的分支。分流选择控制左右两侧展示的同一份证据。')}</p><p>${t('The workspace saves on this device. Save JSON for a portable backup and exchange it with collaborators. This version has no simultaneous multi-user editing. Enter anonymized research material only.','工作区保存在当前设备。保存 JSON 可进行备份或与协作者交换文件。此版本不支持多人实时同步。请仅填写去标识化的研究材料。')}</p>`,null);}
function aboutDialog(){openDialog(t('About this tool','关于这个工具'),`<div class="about-text"><p><strong>Pathway Redesign</strong> ${t('is a web adaptation of the dialogic tool developed in Peng Lu’s master’s thesis in Product–Service System Design, supervised by Daniela Sangiorgi.','改编自 Peng Lu 在 Daniela Sangiorgi 指导下完成的产品服务系统设计硕士论文中的对话工具。')}</p><p><em>Acknowledging the Voice of Service Design(ers) in Healthcare and Vice Versa: Exploring a Dialogic Tool as a Boundary Object for Patient Experience Improvement.</em> Academic year 2021/2022.</p><h3>${t('What is carried forward','延续的结构')}</h3><p>${t('The shared pathway, sub-sections and patient flows link experience design evidence with clinical and managerial evidence. The tool supports cross-disciplinary communication; its dimensions, criteria and weights are open to negotiation.','以共同路径、子区段和患者分流连接体验设计证据与临床管理证据，促进跨专业交流。维度、评价标准和权重均可共同讨论。')}</p><h3>${t('What this web version changes','网页版的调整')}</h3><p>${t('Editable graph nodes and branches, linked evidence panels, configurable dimensions, explicit missing data, local saving and file exchange. Graph drag-and-drop, discussion records and the interface are new implementation choices. The original thesis supports a timeline-to-flowchart development; this version implements the later flowchart approach.','可编辑节点与分支、联动证据面板、可配置维度、明确的缺失数据、本地保存与文件交换。拖动、讨论记录和界面是本次实现新增的方式。原论文经历了从时间线到流程图的迭代，本版本采用后期流程图结构。')}</p><h3>${t('Transparent calculation','明确的计算规则')}</h3><p>${t('Each side uses the weighted average of active grades. The example’s experience weights 3, 4, 5 and 2 sum to 14; its first grades 4, 5, 6 and 4 give 5.00, correcting the source workbook’s mismatched denominator. The example’s managerial weights sum to 17; target time has weight 0. Both the original sum (/20) and the thesis-proposed weighted balance (/10) are available.','每侧采用有效评分的加权平均。示例体验权重 3、4、5、2 合计为 14，首组评分 4、5、6、4 得到 5.00，修正原表格分母不一致的问题。示例管理侧权重合计为 17，目标时间权重为 0。可选择原版相加（满分 20）或论文提出的两侧加权平衡（满分 10）。')}</p><h3>${t('Example provenance & limits','示例来源与边界')}</h3><p>${t('S-1 and S-2 use illustrative values from the supplied example workbook. Other scores stay blank. The map is a simplified reconstruction of thesis Figure 46, adapted there from Schertler et al. (2007), DOI 10.1007/s00330-007-0724-9. It is not a current care protocol or a clinical decision aid.','S-1 与 S-2 使用所提供示例表格中的演示值，其他分数留空。路径图简化重建自论文图 46；该图源于 Schertler 等人（2007），DOI 10.1007/s00330-007-0724-9。此图不作为现行诊疗规程或临床决策依据。')}</p><p>${t('The thesis’s proposed shared-learning process is a future direction, rather than a validated outcome. This web adaptation has not been evaluated with healthcare teams.','论文提出的共同学习过程属于未来方向，不能视为已验证的成果。本网页版尚未经过医护团队的使用评估。')}</p><p>© Peng Lu · ${t('No source photographs or third-party sticker artwork are redistributed.','不附带原材料中的照片或第三方贴纸图案。')}</p></div>`,null);}
function exportsDialog(){openDialog(t('Take the conversation with you','导出当前工作'),`<p>${t('JSON keeps the entire editable project, including the map, evidence, weights and discussion records. CSV is a table for analysis; it cannot restore a project. SVG exports the map. Print includes the map, criteria and evidence.','JSON 保留完整可编辑项目，包括路径、证据、权重和讨论记录。CSV 为分析用表格，无法恢复项目。SVG 导出路径图。打印报告包含路径、评价依据与证据。')}</p><div class="stack">${btn('export',t('Save editable project · JSON','保存可编辑项目 · JSON'),'download')}${btn('csv',t('Evidence table · CSV','证据表格 · CSV'),'table')}${btn('svg',t('Pathway diagram · SVG','路径图 · SVG'),'map')}${btn('print',t('Print report / save as PDF','打印报告或另存 PDF'),'print')}</div>`,null);}

t('Evidence / reason','证据与理由')}</th></tr></thead><tbody>${project.dimensions.map(d=>{const v=f.values[d.id]||{};return `<tr><td>${esc(dlabel(d))} · w ${d.weight}</td><td>${esc(v.value)} ${esc(d.unit)}</td><td>${fmt(v.score)}</td><td>${esc(v.note)}</td></tr>`;}).join('')}</tbody></table><p>${t('Experience notes','体验记录')}: ${esc(f.experienceNotes)}<br>${t('Managerial notes','管理记录')}: ${esc(f.managementNotes)}<br>${t('Source','来源')}: ${esc(f.source)}</p>${f.discussion.map(a=>`<p>[${esc(a.status)}] ${esc(a.text)} · ${esc(a.owner)}</p>`).join('')}`).join('')}</section>`).join('')}`;
 $('#dialog').close();window.print();
}
function runAction(action,el){
 const id=el?.dataset.id;
 switch(action){
  case 'export':download(slug()+'.json',JSON.stringify({...project,updatedAt:new Date().toISOString()},null,2),'application/json');toast(t('Editable project downloaded.','已下载可编辑项目。'));break;
  case 'import':$('#import-file').click();break;
  case 'csv':download(slug()+'-evidence.csv',csvExport(project),'text/csv;charset=utf-8');break;
  case 'svg':download(slug()+'-pathway.svg','<?xml version="1.0" encoding="UTF-8"?>\n'+graphSvg(true),'image/svg+xml');break;
  case 'print':printReport();break;
  case 'exports':exportsDialog();break;
  case 'help':helpDialog();break;
  case 'about':aboutDialog();break;
  case 'language':language=language==='en'?'zh':'en';try{localStorage.setItem(STORE+'-language',language);}catch(e){}renderApp();break;
  case 'undo':if(history.length){future.push(clone(project));project=history.pop();save();renderApp();}break;
  case 'redo':if(future.length){history.push(clone(project));project=future.pop();save();renderApp();}break;
  case 'new':confirmDialog(t('Start a new pathway?','开始新路径？'),t('A blank project will replace the current workspace on this device.','空白项目会替换此设备上的当前工作区。'),()=>mutate(()=>{project=createProject();sectionId=project.sections[0].id;flowId=activeSection().flows[0].id;view='settings';editGraph=false;}));break;
  case 'example':confirmDialog(t('Load the thesis example?','加载论文示例？'),t('The example will replace the current workspace.','示例会替换当前工作区。'),()=>mutate(()=>{project=exampleProject();sectionId=project.sections[0].id;flowId=activeSection().flows[0].id;view='workspace';editGraph=false;}));break;
  case 'project-settings':case 'scoring-settings':view='settings';renderApp();if(action==='scoring-settings')$('#scoring-settings')?.scrollIntoView({behavior:'smooth'});break;
  case 'go-priorities':view='priorities';renderApp();break;
  case 'edit-section':editSection(id||sectionId);break;
  case 'edit-flow':editFlow(id||flowId,el?.dataset.section||sectionId);break;
  case 'add-section':openDialog(t('Add sub-section','添加子区段'),modalField(t('Sub-section name','子区段名称'),'label','',{required:true}),data=>mutate(()=>{if(project.sections.length>=100){toast('Limit: 100 sub-sections.');return;}const s=createSection(data.label);project.sections.push(s);sectionId=s.id;flowId=s.flows[0].id;const y=project.nodes.length?Math.max(...project.nodes.map(n=>n.y))+150:70;project.nodes.push({id:uid('node'),sectionId:s.id,label:data.label,kind:'process',x:300,y:Math.min(y,20000)});}));break;
  case 'add-flow':openDialog(t('Add patient flow','添加患者分流'),modalField(t('Sub-section','子区段'),'section',id||sectionId,{options:project.sections.map(s=>[s.id,s.label])})+modalField(t('Flow label','分流名称'),'label',t('New patient flow','新患者分流'),{required:true}),data=>mutate(()=>{const s=project.sections.find(s=>s.id===data.section);if(s.flows.length>=50){toast('Limit: 50 flows per sub-section.');return;}const f=createFlow(data.label);s.flows.push(f);sectionId=s.id;flowId=f.id;}));break;
  case 'section-up':case 'section-down':mutate(()=>{const i=project.sections.findIndex(s=>s.id===id),j=i+(action==='section-up'?-1:1);if(j>=0&&j<project.sections.length)[project.sections[i],project.sections[j]]=[project.sections[j],project.sections[i]];});break;
  case 'delete-section':confirmDialog(t('Delete this sub-section?','删除此子区段？'),t('Its flows, evidence, map nodes and related connections will be removed.','将删除此区段的所有分流、证据、路径节点及相关连接。'),()=>mutate(()=>{const ns=new Set(project.nodes.filter(n=>n.sectionId===id).map(n=>n.id));project.sections=project.sections.filter(s=>s.id!==id);project.nodes=project.nodes.filter(n=>!ns.has(n.id));project.edges=project.edges.filter(e=>!ns.has(e.from)&&!ns.has(e.to));}));break;
  case 'delete-flow':confirmDialog(t('Delete this flow?','删除此分流？'),t('All evidence and discussion notes for this flow will be removed.','将删除此分流的证据与讨论记录。'),()=>mutate(()=>{const s=project.sections.find(s=>s.id===(el.dataset.section||sectionId));s.flows=s.flows.filter(f=>f.id!==id);project.nodes.filter(n=>n.flowId===id).forEach(n=>delete n.flowId);}));break;
  case 'toggle-graph':editGraph=!editGraph;renderApp();break;
  case 'add-node':openDialog(t('Add pathway node','添加路径节点'),modalField(t('Node label','节点文字'),'label','',{required:true})+modalField(t('Sub-section','子区段'),'sectionId',sectionId,{options:project.sections.map(s=>[s.id,s.label])})+modalField(t('Shape','节点形状'),'kind','process',{options:[['process',t('Step','步骤')],['decision',t('Decision','决策')],['terminal',t('Start / end','开始或结束')]]}),data=>mutate(()=>{if(project.nodes.length>=300){toast('Limit: 300 nodes.');return;}const y=Math.min(20000,Math.max(60,...project.nodes.filter(n=>n.sectionId===data.sectionId).map(n=>n.y))+100);project.nodes.push({id:uid('node'),...data,x:300,y});}));break;
  case 'add-edge':if(project.edges.length>=600){toast('Limit: 600 connections.');return;}edgeDialog();break;
  case 'edit-edge':edgeDialog(id);break;
  case 'delete-edge':mutate(()=>{project.edges=project.edges.filter(e=>e.id!==id);});$('#dialog').close();break;
  case 'delete-node':confirmDialog(t('Delete this node?','删除此节点？'),t('The node and its connections will be removed. The sub-section evidence stays.','将删除节点及其连接，保留区段证据。'),()=>mutate(()=>{project.nodes=project.nodes.filter(n=>n.id!==id);project.edges=project.edges.filter(e=>e.from!==id&&e.to!==id);}));break;
  case 'add-dimension':openDialog(t('Add a shared measure','添加共同指标'),modalField(t('Dimension name','维度名称'),'label','',{required:true})+modalField(t('Chinese label (optional)','中文名称（可选）'),'labelZh','')+modalField(t('Perspective','视角'),'side',el.dataset.side,{options:[['experience',t('Experience design','体验设计')],['management',t('Clinical & managerial','临床与管理')]]})+modalField(t('Weight','权重'),'weight',1,{type:'number',max:100})+modalField(t('Grading criteria','评分依据'),'rubric',t('1 = weakest; 10 = strongest. Agree on local criteria.','1 = 最弱，10 = 最佳。请共同确定具体标准。'),{textarea:true}),data=>mutate(()=>{if(project.dimensions.length>=40){toast('Limit: 40 dimensions.');return;}project.dimensions.push({id:uid('dimension'),...data,weight:Number(data.weight),kind:'text',unit:''});}));break;
  case 'delete-dimension':if(project.dimensions.length<=1){toast(t('Keep at least one dimension.','至少保留一个维度。'));break;}confirmDialog(t('Remove this dimension?','移除此维度？'),t('Its evidence and grades will be removed from all flows.','将从所有分流中删除此维度的证据与评分。'),()=>mutate(()=>{project.dimensions=project.dimensions.filter(d=>d.id!==id);rows(project).forEach(r=>delete r.flow.values[id]);}));break;
  case 'add-discussion':discussionDialog();break;
  case 'edit-discussion':discussionDialog(id);break;
  case 'delete-discussion':confirmDialog(t('Delete this note?','删除此记录？'),t('This discussion record will be removed.','将删除这条讨论记录。'),()=>mutate(()=>{activeFlow().discussion=activeFlow().discussion.filter(a=>a.id!==id);}));break;
 }
}
function bindGraph(){
 const svg=$('#pathway-svg');if(!svg)return;
 const activate=el=>{if(el.dataset.node){const n=project.nodes.find(n=>n.id===el.dataset.node);if(editGraph)nodeDialog(n.id);else{const scroller=$('#graph-scroll'),x=scroller.scrollLeft,y=scroller.scrollTop,previousSection=sectionId;sectionId=n.sectionId;flowId=n.flowId||(previousSection===sectionId?flowId:activeSection().flows[0].id);renderApp();$('#graph-scroll').scrollTo(x,y);}}else if(el.dataset.edge&&editGraph)edgeDialog(el.dataset.edge);};
 svg.addEventListener('keydown',e=>{const el=e.target.closest('[data-node],[data-edge]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();activate(el);}});
 svg.addEventListener('click',e=>{if(!editGraph){const el=e.target.closest('[data-node]');if(el)activate(el);}else{const el=e.target.closest('[data-edge]');if(el)activate(el);}});
 if(!editGraph)return;
 svg.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;const el=e.target.closest('[data-node]');if(!el)return;
  e.preventDefault();const n=project.nodes.find(n=>n.id===el.dataset.node),startX=e.clientX,startY=e.clientY,oldX=n.x,oldY=n.y,b=graphBounds(),ratio=b.width/svg.getBoundingClientRect().width;let x=oldX,y=oldY,moved=false;
  el.setPointerCapture(e.pointerId);
  const move=ev=>{const dx=(ev.clientX-startX)*ratio,dy=(ev.clientY-startY)*ratio;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;x=Math.max(10,Math.min(10000,oldX+dx));y=Math.max(30,Math.min(20000,oldY+dy));el.setAttribute('transform',`translate(${x} ${y})`);};
  const finish=ev=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',finish);el.removeEventListener('pointercancel',cancel);if(el.hasPointerCapture(ev.pointerId))el.releasePointerCapture(ev.pointerId);if(moved){const scroller=$('#graph-scroll'),sx=scroller.scrollLeft,sy=scroller.scrollTop;mutate(()=>{n.x=Math.round(x);n.y=Math.round(y);});$('#graph-scroll').scrollTo(sx,sy);}else activate(el);};
  const cancel=ev=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',finish);el.removeEventListener('pointercancel',cancel);el.setAttribute('transform',`translate(${oldX} ${oldY})`);};
  el.addEventListener('pointermove',move);el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',cancel);
 });
}
function setField(path,value){
 const parts=path.split('.');let target;
 if(parts[0]==='flow'){target=activeFlow();parts.shift();if(parts[0]==='values'){target.values[parts[1]]??={value:'',score:null,note:''};}}
 else if(parts[0]==='project'){target=project;parts.shift();}
 else if(parts[0]==='settings'){target=project.settings;parts.shift();}
 else if(parts[0]==='dimension'){target=project.dimensions.find(d=>d.id===parts[1]);parts.splice(0,2);}
 if(!target)return;while(parts.length>1){target=target[parts.shift()];}target[parts[0]]=value;
}
function start(){
 document.addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action){runAction(action.dataset.action,action);return;}const tab=e.target.closest('[data-view]');if(tab){view=tab.dataset.view;renderApp();return;}const toggle=e.target.closest('[data-dimension-toggle]');if(toggle){const id=toggle.dataset.dimensionToggle;if(expanded.has(id))expanded.delete(id);else expanded.add(id);const x=$('#graph-scroll')?.scrollLeft,y=$('#graph-scroll')?.scrollTop;renderApp();$('#graph-scroll')?.scrollTo(x||0,y||0);return;}const selectButton=e.target.closest('[data-select-section]');if(selectButton){view='workspace';select(selectButton.dataset.selectSection,selectButton.dataset.selectFlow);window.scrollTo(0,0);}});
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.closest('input,textarea,select,[contenteditable]')&&!$('#dialog').open){e.preventDefault();runAction(e.shiftKey?'redo':'undo');}});
 $('#app').addEventListener('focusout',()=>{inputSession=null;});
 $('#app').addEventListener('input',e=>{
  if(e.target.id==='zoom'){zoom=Number(e.target.value);const svg=$('#pathway-svg'),b=graphBounds();svg.setAttribute('width',b.width*zoom/100);svg.setAttribute('height',b.height*zoom/100);$('#zoom-label').textContent=zoom+'%';return;}
  const path=e.target.dataset.field;if(!path)return;let value=e.target.value;
  if(e.target.type==='number'){
   e.target.setCustomValidity('');
   if(value===''){value=null;}else{value=Number(value);if(!Number.isFinite(value))return;const min=Number(e.target.min),max=Number(e.target.max);if(value<min||value>max){e.target.setCustomValidity(t(`Use a number between ${min} and ${max}.`,`请输入 ${min} 至 ${max} 之间的数字。`));e.target.reportValidity();return;}e.target.setCustomValidity('');}
   // All raw observations remain strings; only grades, weights and counts are numeric.
   if(path.endsWith('.value'))value=value===null?'':String(value);
   if((path.endsWith('.weight')||path.startsWith('settings.'))&&value===null)value=0;
  }
  const record=inputSession!==e.target;if(record)inputSession=e.target;
  mutate(()=>setField(path,value),{render:false,record});
 });
 $('#app').addEventListener('change',e=>{
  if(e.target.id==='section-select'){select(e.target.value);return;}

 const groups=project.sections.map((s,i)=>{const ns=project.nodes.filter(n=>n.sectionId===s.id);if(!ns.length)return '';const minX=Math.min(...ns.map(n=>n.x))-28,minY=Math.min(...ns.map(n=>n.y))-32,maxX=Math.max(...ns.map(n=>n.x+164))+28,maxY=Math.max(...ns.map(n=>n.y+nodeHeight(n)))+22;return `<g><rect x="${Math.max(5,minX)}" y="${Math.max(5,minY)}" width="${maxX-Math.max(5,minX)}" height="${maxY-Math.max(5,minY)}" rx="11" fill="${s.id===sectionId?'#f8f0ce':'#f7f8f2'}" fill-opacity="${s.id===sectionId?'.85':'.6'}" stroke="${s.id===sectionId?'#c8b774':'#d8dfce'}" stroke-dasharray="4 5"/><text x="${Math.max(13,minX+12)}" y="${Math.max(19,minY+18)}" font-size="10" fill="#8b805e" font-weight="600">S-${i+1}</text></g>`;}).join('');
 const edges=project.edges.map(e=>{const a=project.nodes.find(n=>n.id===e.from),c=project.nodes.find(n=>n.id===e.to);if(!a||!c)return '';const x1=a.x+82,y1=a.y+nodeHeight(a),x2=c.x+82,y2=c.y;const mid=(y1+y2)/2;const path=y2>y1?`M${x1} ${y1} V${mid} H${x2} V${y2-6}`:`M${x1} ${y1} C${x1+130} ${y1+60} ${x2+130} ${y2-60} ${x2} ${y2-6}`;return `<g ${!exporting&&editGraph?`data-edge="${e.id}" role="button" tabindex="0" aria-label="${esc(t('Edit connection: ','编辑连接：')+e.label)}" style="cursor:pointer"`:''}><path d="${path}" fill="none" stroke="transparent" stroke-width="16"/><path d="${path}" fill="none" stroke="#7e9180" stroke-width="1.5" marker-end="url(#arrow)"/>${e.label?`<text x="${(x1+x2)/2+5}" y="${mid-7}" fill="#63735e" font-size="9" stroke="#fafbf7" stroke-width="3" paint-order="stroke">${esc(e.label)}</text>`:''}</g>`;}).join('');
 const nodes=project.nodes.map(n=>{const selected=n.sectionId===sectionId&&(!n.flowId||n.flowId===flowId),h=nodeHeight(n),kind=n.kind,lines=wrapText(n.label);const shape=kind==='decision'?`<path d="M18 0 H146 L164 ${h/2} L146 ${h} H18 L0 ${h/2}Z"`:`<rect width="164" height="${h}" rx="${kind==='terminal'?h/2:7}"`;return `<g transform="translate(${n.x} ${n.y})" ${!exporting?`data-node="${n.id}" role="button" tabindex="0" aria-label="${esc(n.label)}" aria-pressed="${selected}" style="cursor:${editGraph?'grab':'pointer'}"`:''}>${shape} fill="${selected?'#fffdf2':'#ffffff'}" stroke="${selected?'#7d814c':'#b6c3ad'}" stroke-width="${selected?2:1.2}"/><text x="82" y="${h/2-(lines.length-1)*7.5+4}" text-anchor="middle" font-size="11" fill="#304a37" font-weight="500">${lines.map((l,i)=>`<tspan x="82" dy="${i?15:0}">${esc(l)}</tspan>`).join('')}</text></g>`;}).join('');
 return `<svg id="pathway-svg" xmlns="http://www.w3.org/2000/svg" width="${exporting?b.width:b.width*scale}" height="${exporting?b.height:b.height*scale}" viewBox="0 0 ${b.width} ${b.height}" style="font-family:Arial,sans-serif" role="group" aria-label="${esc(t('Interactive pathway map','交互式路径图'))}"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#7e9180"/></marker></defs><rect width="100%" height="100%" fill="#fcfcf9"/>${groups}${edges}${nodes}${!project.nodes.length?`<text x="60" y="120" font-size="16" fill="#73806b">${t('Add a node to begin your map.','添加节点以开始绘制路径。')}</text>`:''}</svg>`;
}
function matrixView(){const rr=rows(project);return `<div class="content-header"><div><h2>${t('Different perspectives. One shared view.','同一视图中的不同视角。')}</h2><p>${t('Read across each patient flow to connect experience, operational evidence and team-assigned grades. Select a row to edit the underlying evidence. Raw measures remain separate from grades.','沿每一分流横向查看体验、运作证据与团队评分。点击行名称编辑证据。原始观察值与评分分别保存。')}</p></div>${btn('csv',t('Download CSV','下载 CSV'),'download','small')}</div><div class="matrix-wrap"><table class="matrix"><thead><tr><th rowspan="2">${t('Sub-section / flow','子区段与分流')}</th><th rowspan="2">${t('Patients','患者人数')}</th><th colspan="${project.dimensions.filter(d=>d.side==='experience').length||1}" class="exp">${t('Experience design · grade / 10','体验设计 · 评分 / 10')}</th><th colspan="${project.dimensions.filter(d=>d.side==='management').length||1}" class="mgmt">${t('Clinical & managerial · grade / 10','临床与管理 · 评分 / 10')}</th><th rowspan="2">${t('Combined','综合分')} / ${maxGrade()}</th></tr><tr>${['experience','management'].map(side=>project.dimensions.filter(d=>d.side===side).map(d=>`<th class="${side==='experience'?'exp':'mgmt'}">${esc(dlabel(d))}<small>w ${d.weight}</small></th>`).join('')||'<th>—</th>').join('')}</tr></thead><tbody>${rr.map(r=>`<tr><td><button type="button" class="row-link" data-select-section="${r.section.id}" data-select-flow="${r.flow.id}">S-${project.sections.indexOf(r.section)+1} · ${esc(r.section.label)}</button><small>${esc(r.flow.label)}</small></td><td>${r.flow.volume??'—'}</td>${['experience','management'].map(side=>project.dimensions.filter(d=>d.side===side).map(d=>{const v=r.flow.values[d.id]||{};return `<td>${fmt(v.score,1)}${v.value?`<small>${esc(v.value)} ${esc(d.unit)}</small>`:''}</td>`;}).join('')||'<td>—</td>').join('')}<td><strong>${fmt(r.combined)}</strong><small>${r.combined===null?t('Incomplete','未完成'):t('Team benchmark','团队评价')}</small></td></tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:16px">${t('A blank is not zero. A side grade is calculated only when every dimension with a positive weight has a grade. Dimensions with weight 0 are retained as context.','空白不等于零。仅在该侧所有正权重维度都有评分时计算该侧分数。权重为 0 的维度保留作参照。')}</div>`;}
function prioritiesView(){const all=rows(project),ranked=priorityRows(project),incomplete=all.length-ranked.length;return `<div class="content-header"><div><h2>${t('Where should the conversation begin?','先从哪里开始讨论？')}</h2><p>${t('Flows with lower complete grades appear first. Use the ranking to open a discussion, then return to the evidence and the people behind it. Patient volumes are context; flows may overlap and are not added together.','完整评分较低的分流排在前面。排序用于开启讨论，之后仍需回到证据及相关人员。患者人数仅作参照；分流可能重叠，人数不进行相加。')}</p></div>${btn('scoring-settings',t('Review weights','查看权重'),'settings','small')}</div><div class="stat-grid"><div class="stat-card"><span class="eyebrow">${t('Ready to compare','可比较')}</span><strong>${ranked.length}</strong><p>${t('Flows with complete active grades','启用维度均已完成评分的分流')}</p></div><div class="stat-card"><span class="eyebrow">${t('Still to understand','待补充')}</span><strong>${incomplete}</strong><p>${t('Flows awaiting grades or an active scoring setup','等待评分或有效评分设置的分流')}</p></div><div class="stat-card"><span class="eyebrow">${t('Current method','当前方法')}</span><strong style="font-size:24px">${t(project.settings.combination==='sum'?'Sum / 20':'Weighted / 10',project.settings.combination==='sum'?'相加 / 20':'加权 / 10')}</strong><p>${t('Higher grades mean stronger performance','高分统一表示更好的表现')}</p></div></div><div class="rank-list">${ranked.map((r,i)=>`<article class="rank-card"><div class="rank-number">${String(i+1).padStart(2,'0')}</div><div class="rank-title"><strong>${esc(r.section.label)}</strong><small>${esc(r.flow.label)} · ${r.flow.volume??'—'} ${t('patients','人')}</small></div><div class="rank-bar"><span class="help">${t('Team benchmark','团队评价')}</span><div class="bar-track"><div style="width:${r.combined/maxGrade()*100}%"></div></div></div><div class="rank-comparison help">${t('Experience','体验')} ${fmt(r.experience.value)}<br>${t('Managerial','管理')} ${fmt(r.management.value)}</div><div class="rank-score">${fmt(r.combined)}<small> / ${maxGrade()}</small></div><div style="grid-column:2/-1;display:flex;gap:14px;align-items:center;justify-content:space-between"><span class="help">${esc(r.flow.insight)||t('Return to the evidence to discuss this flow.','回到证据，讨论此分流。')}</span><button class="small" type="button" data-select-section="${r.section.id}" data-select-flow="${r.flow.id}">${t('Explore','查看')}${icon('arrow')}</button></div></article>`).join('')||`<div class="empty">${t('No flows can be ranked yet. Agree on the dimensions and weights, then complete the active grades for a flow.','尚无可排序的分流。请先讨论维度与权重，再完成至少一个分流的评分。')}</div>`}</div>${incomplete?`<div class="content-header"><div><h3>${t('Unranked · evidence still needed','未排序 · 尚需补充证据')}</h3><p>${t('These flows remain visible so missing data cannot disappear into a reassuring average.','这些分流始终可见，避免缺失数据被平均分掩盖。')}</p></div></div><div class="row wrap">${all.filter(r=>r.combined===null).map(r=>`<button type="button" class="small" data-select-section="${r.section.id}" data-select-flow="${r.flow.id}">S-${project.sections.indexOf(r.section)+1} · ${esc(r.flow.label)}</button>`).join('')}</div>`:''}`;}
function settingsView(){return `<div class="content-header"><div><h2>${t('Build the tool together.','共同构建这个工具。')}</h2><p>${t('Agree on the goal, the dimensions that matter and what each grade means. The choices made here become part of the dialogue between service designers and healthcare teams.','先讨论目标、重要的维度，以及每项评分的含义。这里的设置本身就是服务设计师与医护团队之间对话的一部分。')}</p></div>${btn('help',t('Facilitation guide','讨论指南'),'help','small')}</div><div class="two-column"><section class="card"><h3>${t('01 · Shared purpose','01 · 共同目标')}</h3><div class="form-grid">${field(t('Pathway / unit name','路径或单位名称'),'project.title',project.title,{cls:'full-row'})}${field(t('Redesign goal','改进目标'),'project.goal',project.goal,{textarea:true,cls:'full-row'})}${field(t('Time range','时间范围'),'project.period',project.period)}${field(t('Total patient volume','患者总人数'),'project.volume',project.volume,{type:'number',step:1})}${field(t('Participating roles / team','参与角色与团队'),'project.team',project.team,{cls:'full-row'})}${field(t('Scope, assumptions & context','范围、假设与背景'),'project.context',project.context,{textarea:true,cls:'full-row'})}</div></section><section class="card"><h3>${t('02 · Sub-sections & patient flows','02 · 子区段与患者分流')}</h3><p class="help">${t('A sub-section groups steps around a decision or meaningful transition. Each flow can hold a different set of evidence. Ordering below controls section numbering, not graph connections.','子区段按决策或重要转折组织步骤；其中每个分流保存不同的证据。下方顺序决定区段编号，不改变流程图连接。')}</p><div class="section-list">${project.sections.map((s,i)=>`<div class="section-item"><span class="number">S-${i+1}</span><div class="spacer"><strong>${esc(s.label)}</strong><p>${s.flows.map(f=>esc(f.label)).join(' · ')}</p>${s.summary?`<p>${esc(s.summary)}</p>`:''}</div><div class="row" style="gap:2px">${btn('section-up','↑','','small quiet',`data-id="${s.id}" ${i===0?'disabled':''} aria-label="${t('Move sub-section up','上移子区段')}"`)}${btn('section-down','↓','','small quiet',`data-id="${s.id}" ${i===project.sections.length-1?'disabled':''} aria-label="${t('Move sub-section down','下移子区段')}"`)}${btn('edit-section','','edit','small icon-only quiet',`data-id="${s.id}" aria-label="${t('Edit sub-section','编辑子区段')}"`)}</div></div>`).join('')}</div><div class="row" style="margin-top:14px">${btn('add-section',t('Add sub-section','添加子区段'),'plus','small')}${btn('add-flow',t('Add flow','添加分流'),'plus','small')}</div></section></div>
 <div class="content-header"><div><h3>${t('03 · Dimensions, weights & grading criteria','03 · 维度、权重与评分依据')}</h3><p>${t('A higher grade always means a better experience or stronger performance. Raw minutes and costs do not turn into grades automatically. Set weight 0 to retain a measure as context.','高分统一表示更好的体验或表现。分钟、成本等原始值不自动转换为评分。权重设为 0 可将该维度仅作为参照。')}</p></div></div><div class="two-column">${['experience','management'].map(side=>`<section class="card"><div class="row between"><h3>${t(side==='experience'?'Experience design':'Clinical & managerial',side==='experience'?'体验设计':'临床与管理')}</h3>${btn('add-dimension',t('Add dimension','添加维度'),'plus','small',`data-side="${side}"`)}</div>${project.dimensions.filter(d=>d.side===side).map(d=>`<div class="settings-dimension">${field(t('Dimension name','维度名称'),`dimension.${d.id}.label`,d.label)}${field(t('Weight','权重'),`dimension.${d.id}.weight`,d.weight,{type:'number',max:100,step:.1})}${btn('delete-dimension','','trash','quiet danger remove',`data-id="${d.id}" aria-label="${t('Remove dimension','移除维度')} ${esc(d.label)}"`)}<details><summary>${t('Label, evidence type & grading criteria','名称、证据类型与评分依据')}</summary><div class="form-grid">${field(t('Chinese label','中文名称'),`dimension.${d.id}.labelZh`,d.labelZh||'')}<label class="field">${t('Evidence type','证据类型')}<select data-field="dimension.${d.id}.kind"><option value="text" ${d.kind==='text'?'selected':''}>${t('Text','文字')}</option><option value="number" ${d.kind==='number'?'selected':''}>${t('Number','数字')}</option></select></label>${field(t('Unit','单位'),`dimension.${d.id}.unit`,d.unit)}${field(t('Grading criteria / definition','评分依据与操作定义'),`dimension.${d.id}.rubric`,d.rubric,{textarea:true,cls:'full-row'})}</div></details></div>`).join('')}<div class="help">${t('Active weight total','正权重总和')}: <strong data-weight-total="${side}">${project.dimensions.filter(d=>d.side===side).reduce((s,d)=>s+d.weight,0)}</strong></div></section>`).join('')}</div>
 <section class="card" id="scoring-settings" style="margin-top:20px"><h3>${t('04 · How the shared benchmark is calculated','04 · 共同评价如何计算')}</h3><div class="two-column"><div class="stack"><label class="field">${t('Combine the two perspectives','两侧分数合成方式')}<select data-field="settings.combination"><option value="sum" ${project.settings.combination==='sum'?'selected':''}>${t('Original sum · experience + managerial · /20','原版相加 · 体验分 + 管理分 · 满分 20')}</option><option value="weighted" ${project.settings.combination==='weighted'?'selected':''}>${t('Weighted balance · normalized · /10','加权平衡 · 归一化 · 满分 10')}</option></select></label>${project.settings.combination==='weighted'?`<div class="form-grid">${field(t('Experience side weight','体验侧权重'),'settings.experienceWeight',project.settings.experienceWeight,{type:'number',max:100})}${field(t('Managerial side weight','管理侧权重'),'settings.managementWeight',project.settings.managementWeight,{type:'number',max:100})}</div>`:''}<div class="formula">${t('Side grade = Σ (grade × weight) / Σ active weights','单侧分数 = Σ（评分 × 权重）/ Σ 正权重')}<br>${t('All positively weighted dimensions must be graded.','所有正权重维度均需评分。')}<br>${project.settings.combination==='sum'?t('Combined = experience grade + managerial grade','综合分 = 体验分 + 管理分'):t('Combined = (E × experience grade + M × managerial grade) / (E + M). A side weight of 0 excludes that side.','综合分 =（E × 体验分 + M × 管理分）/（E + M）。侧权重为 0 时排除该侧。')}</div></div>${field(t('Why these measures, weights and grading rules?','为什么采用这些指标、权重与评分规则？'),'settings.weightRationale',project.settings.weightRationale,{textarea:true})}</div></section>`;}
